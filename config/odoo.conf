[options]
; Configuración del LABORATORIO LOCAL de cada integrante.
; (El servidor tiene su propia configuración, ajustada a 2 GB de RAM.)

; /mnt/extra-addons     → la raíz del repo (nuestro módulo)
; /mnt/addons-externos  → módulos de terceros que se instalan sólo para evaluar
addons_path = /mnt/extra-addons,/mnt/addons-externos
data_dir = /var/lib/odoo

; Master password: sólo para crear/administrar bases del lab local.
admin_passwd = tfc_local_2026

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; workers = 0 → modo hilo único: más simple para desarrollar y depurar.
workers = 0
log_level = info

; Dentro del contenedor hay que escuchar en todas las interfaces:
; Docker es quien publica el puerto hacia tu máquina.
http_interface = 0.0.0.0
